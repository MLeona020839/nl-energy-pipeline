[project]
name = "nl-energy-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ming", email = "wmj327728951@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "entsoe-py>=0.8.1",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
nl-energy-pipeline = "nl_energy_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
