name: Scheduled ingest

on:
  schedule:
    - cron: "30 6 * * *" # daily, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # Re-fetching 3 days is cheap and idempotent: it also back-fills late-published values.
      - run: uv run nl-energy-pipeline ingest --days 3 --no-parquet
      - name: Retrain on Mondays
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run nl-energy-pipeline train
          fi
